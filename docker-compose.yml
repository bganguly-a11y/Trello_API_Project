version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trello_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trello_clone
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trello_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/trello_clone
      - SECRET_KEY=replace-me-with-a-long-random-string
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ALGORITHM=HS256
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trello_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
